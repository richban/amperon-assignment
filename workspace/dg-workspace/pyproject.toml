[project]
name = "dg_amperon"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster",
    "dagster-dlt",
    "dagster-sqlmesh",
    "dlt[duckdb]",
    "s3fs",
    "pyarrow",
    "fsspec",
    "sqlmesh[web]",
    "duckdb",
    "marimo",
    "lonboard",
    "altair",
    "matplotlib",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
    "pytest"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dg_amperon"
registry_modules = [
    "dg_amperon.components.*",
]
