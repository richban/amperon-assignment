# --- Gateway Connection ---
gateways:
  duckdb:
    connection:
      type: duckdb
      # Environment-aware database path:
      # - Dev: ../../data/weather.db (local file)
      # - Prod: s3://datalake/duckdb/weather.db (S3)
      database: "{{ env_var('DUCKDB_DATABASE', '../../data/weather.db') }}"
      concurrent_tasks: 1

      # Extensions for S3 access (auto-loaded when using S3 path)
      extensions:
        - httpfs
        - aws

      # S3 credentials (only used when database path starts with s3://)
      secrets:
        - type: s3
          key_id: "{{ env_var('AWS_ACCESS_KEY_ID', 'minioadmin') }}"
          secret: "{{ env_var('AWS_SECRET_ACCESS_KEY', 'minioadmin') }}"
          region: "{{ env_var('AWS_REGION', 'us-east-1') }}"
          endpoint: "{{ env_var('AWS_ENDPOINT_URL', '').replace('http://', '').replace('https://', '') }}"
          use_ssl: "{{ env_var('AWS_USE_SSL', 'false') }}"
          url_style: path

default_gateway: duckdb

# --- Model Defaults ---
# https://sqlmesh.readthedocs.io/en/stable/reference/model_configuration/#model-defaults

model_defaults:
  dialect: duckdb
  start: 2025-12-23  # Start date for backfill history (today)
  cron: '@hourly'    # Run models hourly to match DLT pipeline schedule

# --- Linting Rules ---
# Enforce standards for your team
# https://sqlmesh.readthedocs.io/en/stable/guides/linter/

linter:
  enabled: true
  rules:
    - ambiguousorinvalidcolumn
    - invalidselectstarexpansion
    - noambiguousprojections
