# --- Gateway Connection ---
gateways:
  duckdb:
    connection:
      type: duckdb
      # Environment-aware database path:
      # - Dev: ../../data/weather.db (local file)
      # - Prod: s3://datalake/duckdb/weather.db (S3)
      database: "{{ env_var('DUCKDB_DATABASE', '../../data/weather.db') }}"
      concurrent_tasks: 1

      # Extensions for S3 access (auto-loaded when using S3 path)
      extensions:
        - httpfs
        - aws

default_gateway: duckdb

# --- Model Defaults ---
# https://sqlmesh.readthedocs.io/en/stable/reference/model_configuration/#model-defaults

model_defaults:
  dialect: duckdb
  start: 2025-12-30-12:00
  cron: '@hourly'

# --- Linting Rules ---
# Enforce standards for your team
# https://sqlmesh.readthedocs.io/en/stable/guides/linter/

linter:
  enabled: true
  rules:
    - ambiguousorinvalidcolumn
    - invalidselectstarexpansion
    - noambiguousprojections
