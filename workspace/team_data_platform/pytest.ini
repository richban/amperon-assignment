[pytest]
# Pytest configuration for Tomorrow.io weather pipeline tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    # Uncomment to enable coverage
    # --cov=etl
    # --cov-report=term-missing
    # --cov-report=html

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for full pipeline
    slow: Tests that take longer to run
    api: Tests that interact with external APIs (mocked)
    database: Tests that interact with database

# Environment variables for testing
env =
    RUNTIME__LOG_LEVEL=WARNING
    DLT_PROJECT_DIR=.dlt_test
