version: '3.8'

services:
  # ============================================================================
  # Dagster: Pipeline orchestration
  # ============================================================================
  dagster:
    build:
      context: .
      dockerfile: Dockerfile
    image: amperon-dagster:latest
    command: >
      sh -c "
      dg dev --host 0.0.0.0 --port 3000
      "
    ports:
      - "3000:3000"   # Dagster UI
    environment:
      # Environment
      ENVIRONMENT: dev

      # Tomorrow.io API
      TOMORROW_API_KEY: ${TOMORROW_API_KEY}
      SOURCES__TOMORROW_IO_PIPELINE__TOMORROW_IO_ACCESS_TOKEN: ${TOMORROW_API_KEY}

      # Dagster
      DAGSTER_HOME: /app/dagster_home

      # Storage paths (local files)
      DUCKDB_DATABASE: /app/data/weather.db
      SQLMESH_PROJECT_PATH: /app/sqlmesh

      # DLT Runtime
      RUNTIME__LOG_LEVEL: INFO
    volumes:
      # Mount source for hot reload
      - ./workspace/dg-workspace/src:/app/src
      - ./workspace/sqlmesh:/app/sqlmesh
      # Mount data directory for DuckDB
      - ./data:/app/data
      # Mount dagster_home for persistence
      - ./data/dagster_home:/app/dagster_home
    networks:
      - amperon


  # ============================================================================
  # Marimo: Visualization notebook
  # ============================================================================
  marimo:
    image: amperon-dagster:latest
    command: marimo edit --host 0.0.0.0 --port 2718 --no-token --no-skew-protection /app/notebooks/weather_viz.py
    ports:
      - "2718:2718"
    environment:
      ENVIRONMENT: dev
      DUCKDB_DATABASE: /app/data/weather.db
    volumes:
      - ./workspace/dg-workspace/src/notebooks:/app/notebooks
      - ./data:/app/data
    networks:
      - amperon

networks:
  amperon:
    driver: bridge
