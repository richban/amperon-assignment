version: '3.8'

services:

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/datalake --ignore-existing;
      echo 'MinIO bucket created successfully';
      exit 0;
      "

  # tomorrow:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   command: python -m tomorrow
  #   environment:
  #     TOMORROW_API_KEY: ${TOMORROW_API_KEY}
  #     AWS_ACCESS_KEY_ID: minioadmin
  #     AWS_SECRET_ACCESS_KEY: minioadmin
  #     AWS_ENDPOINT_URL: http://minio:9000
  #   volumes:
  #     - "${PWD}/tomorrow:/app/tomorrow"
  #   depends_on:
  #     minio:
  #       condition: service_healthy
  #     minio-init:
  #       condition: service_completed_successfully

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    command: jupyter notebook --ip 0.0.0.0 --NotebookApp.token='' --NotebookApp.password='' --allow-root
    ports:
      - "8888:8888"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://minio:9000
    volumes:
      - "${PWD}/analysis.ipynb:/app/analysis.ipynb"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio_data:
