version: '3.8'

services:
  # ============================================================================
  # Dagster: Pipeline orchestration
  # ============================================================================
  dagster:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "dagster-daemon run &
             dagster dev -h 0.0.0.0 -p 3000 -m dg_amperon.definitions"
    ports:
      - "3000:3000"   # Dagster UI
    environment:
      # Environment
      ENVIRONMENT: dev
      
      # Tomorrow.io API
      TOMORROW_API_KEY: ${TOMORROW_API_KEY}
      SOURCES__TOMORROW_IO_PIPELINE__TOMORROW_IO_ACCESS_TOKEN: ${TOMORROW_API_KEY}
      
      # Dagster
      DAGSTER_HOME: /app/dagster_home
      
      # Storage paths (local files)
      DUCKDB_DATABASE: /app/data/weather.db
      SQLMESH_PROJECT_PATH: /app/sqlmesh
      
      # DLT Runtime
      RUNTIME__LOG_LEVEL: INFO
    volumes:
      # Mount source for hot reload
      - ./workspace/dg-workspace/src:/app/src
      - ./workspace/sqlmesh:/app/sqlmesh
      # Mount data directory for DuckDB
      - ./data:/app/data
    networks:
      - amperon

  # ============================================================================
  # Marimo: Visualization notebook
  # ============================================================================
  marimo:
    build:
      context: .
      dockerfile: Dockerfile
    command: marimo edit --host 0.0.0.0 --port 8080 --no-token /app/src/notebooks/weather_viz.py
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: dev
      DUCKDB_DATABASE: /app/data/weather.db
    volumes:
      - ./workspace/dg-workspace/src/notebooks:/app/src/notebooks
      - ./data:/app/data
    networks:
      - amperon

networks:
  amperon:
    driver: bridge
