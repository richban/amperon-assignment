version: '3.8'

services:
  # ============================================================================
  # Dagster: Pipeline orchestration
  # ============================================================================
  dagster:
    build:
      context: .
      dockerfile: Dockerfile
    image: amperon-dagster:latest
    command: dg dev --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"   # Dagster UI
      - "8000:8000"   # Marimo (on-demand)
    environment:
      # Environment
      ENVIRONMENT: dev

      # Tomorrow.io API
      SOURCES__TOMORROW_IO_PIPELINE__TOMORROW_IO_ACCESS_TOKEN: ${TOMORROW_API_KEY}

      # Dagster
      DAGSTER_HOME: /app/data/dagster_home

      # Storage paths (local files)
      DUCKDB_DATABASE: /app/data/weather.db
      SQLMESH_PROJECT_PATH: /app/sqlmesh

      # DLT Runtime
      RUNTIME__LOG_LEVEL: INFO

      # DLT Data Directory
      DLT_DATA_DIR: /app/data/dlt
    volumes:
      # Mount data directory for all persistent data (DuckDB, Dagster Home, DLT State)
      - ./data:/app/data
    networks:
      - amperon

networks:
  amperon:
    driver: bridge
